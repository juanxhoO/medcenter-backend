spring.application.name=medcenter-test

# H2 in-memory test database
spring.datasource.url=jdbc:h2:mem:medcenter_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for unit/context test slices
spring.flyway.enabled=false

# JWT Security
app.security.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBIUzUxMiBhbGdvcml0aG0gdGhhdCBuZWVkcyB0byBiZSBhdCBsZWFzdCA1MTIgYml0cw==}
app.security.jwt.access-token-expiration-ms=900000
app.security.jwt.refresh-token-expiration-ms=604800000
