spring.application.name=medcenter

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:medcenter}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# JWT Security
app.security.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBIUzUxMiBhbGdvcml0aG0gdGhhdCBuZWVkcyB0byBiZSBhdCBsZWFzdCA1MTIgYml0cw==}
app.security.jwt.access-token-expiration-ms=900000
app.security.jwt.refresh-token-expiration-ms=604800000

# Seeding
app.seeding.enabled=${APP_SEEDING_ENABLED:true}
app.seeding.admin.email=${APP_SEEDING_ADMIN_EMAIL:admin@medcenter.com}
app.seeding.admin.password=${APP_SEEDING_ADMIN_PASSWORD:Admin123!}
app.seeding.admin.first-name=${APP_SEEDING_ADMIN_FIRST_NAME:System}
app.seeding.admin.last-name=${APP_SEEDING_ADMIN_LAST_NAME:Admin}
app.seeding.admin.phone=${APP_SEEDING_ADMIN_PHONE:+15550000001}
app.seeding.admin.department=${APP_SEEDING_ADMIN_DEPARTMENT:Administration}

